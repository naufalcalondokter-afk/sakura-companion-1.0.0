name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          set +e
          gradle build --stacktrace > build_out.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|warning: \[|What went wrong|Could not|Execution failed|Caused by|symbol:|location:|cannot find|incompatible|does not exist|FAILED" build_out.txt | head -40 | cut -c1-300 | paste -sd'~' - | sed 's/^/::error::/'
            exit $code
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sakura-companion-jar
          path: build/libs/*.jar
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          cp "$JAR" SakuraCompanion.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SakuraCompanion.jar --title "Sakura Companion (jar siap pakai)" --notes "Unduh SakuraCompanion.jar. Wajib pasang juga GeckoLib 5.4.4 untuk Fabric 1.21.11." --target ${{ github.sha }}
